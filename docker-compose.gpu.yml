name: ai-content-factory

x-gpu-reservation: &gpu-reservation
  reservations:
    devices:
      - driver: nvidia
        count: all
        capabilities: [gpu]

services:
  video-worker:
    build:
      args:
        BASE_IMAGE: nvidia/cuda:12.1.1-cudnn8-runtime-ubuntu22.04
        INSTALL_TORCH: "true"
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu121
    environment:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
      GPU_MODE: ${GPU_MODE:-auto}
    deploy:
      resources:
        limits:
          cpus: "8.0"
          memory: 24576M
        <<: *gpu-reservation

  image-worker:
    build:
      args:
        BASE_IMAGE: nvidia/cuda:12.1.1-cudnn8-runtime-ubuntu22.04
        INSTALL_TORCH: "true"
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu121
    environment:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        limits:
          cpus: "8.0"
          memory: 16384M
        <<: *gpu-reservation

  subtitle-worker:
    build:
      args:
        BASE_IMAGE: nvidia/cuda:12.1.1-cudnn8-runtime-ubuntu22.04
    environment:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      WHISPER_DEVICE: cuda
      WHISPER_COMPUTE_TYPE: float16
    deploy:
      resources:
        limits:
          cpus: "6.0"
          memory: 8192M
        <<: *gpu-reservation
